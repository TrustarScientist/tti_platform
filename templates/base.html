<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Trustar Tech Institute{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
        rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blue: '#1A56E8',
                        baby: '#7EB8F7',
                        navy: '#060F2E',
                        gold: '#F5B400',
                        teal: '#0EC4C4',
                        light: '#EAF3FF',
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #F0F6FF;
            color: #111827;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        h4,
        h5 {
            font-family: 'Syne', sans-serif;
        }

        :root {
            --blue: #1A56E8;
            --baby: #7EB8F7;
            --navy: #060F2E;
            --gold: #F5B400;
            --teal: #0EC4C4;
            --light: #EAF3FF;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body class="min-h-screen flex flex-col">
    {% block content %}
    {% endblock %}

    {% block extra_scripts %}{% endblock %}
</body>

</html>
