<!-- templates/partials/_messages.html -->
{% if messages %}
<div class="space-y-2 mb-5" role="status">
    {% for message in messages %}
    <div class="rounded-xl border px-4 py-3 text-sm
        {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-800
        {% elif message.tags == 'success' %}bg-teal/10 border-teal/40 text-navy
        {% else %}bg-light border-baby/60 text-navy{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
