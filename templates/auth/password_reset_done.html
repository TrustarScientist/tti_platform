<!-- templates/auth/password_reset_done.html -->
{% extends "base_auth.html" %}
{% block title %}Check your email | Trustar{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold">Check your email</h1>
<p class="text-sm text-navy/60 mt-2">
    If an account exists for that email, we've sent a link to reset your password.
</p>
{% endblock %}
{% block below_card %}
<p class="text-center text-sm text-navy/60 mt-5">
    <a href="{% url 'login' %}" class="font-medium text-blue hover:underline">Back to log in</a>
</p>
{% endblock %}
