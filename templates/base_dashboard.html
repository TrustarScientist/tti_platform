<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Trustar — {% block title %}Dashboard{% endblock %}</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Shared CSS (Ideally moved to a static main.css file) -->
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%;font-family:'DM Sans',sans-serif;background:#F0F4FF;-webkit-font-smoothing:antialiased;color:#0f172a}
        h1,h2,h3,h4,h5,h6{font-family:'Syne',sans-serif}

        :root{
          --navy:#060F2E; --blue:#1A56E8; --baby:#7EB8F7;
          --teal:#0EC4C4; --gold:#F5B400; --light:#EAF3FF;
          --navy2:#0d1f5a; --muted:#64748b; --border:#E2E8F0;
          --sidebar-w:256px; --topbar-h:64px; --ok:#16a34a;
        }

        /* ── SHELL LAYOUT ── */
        .shell{display:flex;min-height:100vh;position:relative}

        /* ── SIDEBAR BASE ── */
        .sidebar{
          width:var(--sidebar-w);flex-shrink:0;
          background:var(--navy);
          display:flex;flex-direction:column;
          position:fixed;top:0;left:0;bottom:0;z-index:40;
          transition:transform .3s ease;
        }
        .sidebar-logo{padding:1.25rem 1.25rem 1rem;border-bottom:1px solid rgba(255,255,255,.07);}
        .sidebar-scroll{flex:1;overflow-y:auto;padding:1rem .75rem}
        .sidebar-scroll::-webkit-scrollbar{width:3px}
        .sidebar-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
        .sidebar-footer{padding:.75rem;border-top:1px solid rgba(255,255,255,.07)}
        
        /* ── NAV ITEMS ── */
        .nav-section-label{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.75rem .75rem .375rem;color:rgba(255,255,255,.28)}
        .nav-item{display:flex;align-items:center;gap:.75rem;padding:.65rem .875rem;border-radius:.75rem;font-size:.875rem;font-weight:500;color:rgba(255,255,255,.6);cursor:pointer;transition:all .2s;text-decoration:none;margin-bottom:.125rem;position:relative;}
        .nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9)}
        .nav-item.active{background:rgba(26,86,232,.35);color:#fff}
        .nav-item.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;border-radius:0 2px 2px 0;background:linear-gradient(var(--blue),var(--teal));}
        .nav-badge{margin-left:auto;background:var(--blue);color:#fff;font-size:.65rem;font-weight:700;padding:.15rem .45rem;border-radius:9999px;min-width:18px;text-align:center;}
        .nav-badge-gold{background:var(--gold);color:var(--navy)}

        /* ── MAIN CONTENT ── */
        .main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}
        .page-content{flex:1;padding:1.75rem;max-width:1200px;width:100%}

        /* ── MOBILE ADJUSTMENTS ── */
        @media(max-width:768px){
          .sidebar{transform:translateX(-100%)}
          .sidebar.open{transform:translateX(0)}
          .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
          .sidebar-overlay.show{display:block}
          .main{margin-left:0}
          .page-content{padding:1.25rem 1rem;padding-bottom:5rem}
        }
        
        /* Insert the rest of your global UI CSS here (buttons, pills, stat cards, TRS rings, etc.) */
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

    <div class="shell">
        <!-- SIDEBAR BLOCK -->
        {% block sidebar %}
        <!-- Role-specific sidebar will be injected here -->
        {% endblock %}

        <!-- MAIN CONTENT AREA -->
        <div class="main">
            <!-- TOPBAR BLOCK -->
            {% block topbar %}
            <!-- Role-specific topbar will be injected here -->
            {% endblock %}

            <!-- PAGE CONTENT BLOCK -->
            <div class="page-content">
                {% block content %}
                <!-- Main dashboard content goes here -->
                {% endblock %}
            </div>

            <!-- BOTTOM TAB BLOCK (For Mobile) -->
            {% block bottom_tabs %}
            <!-- Role-specific bottom navigation goes here -->
            {% endblock %}
        </div>
    </div>

    <!-- ── SHARED SCRIPTS ── -->
    <script>
        // Sidebar interactions for mobile
        function openSidebar(id) {
            document.getElementById(id).classList.add('open');
            document.getElementById('overlay').classList.add('show');
        }
        function closeSidebar() {
            document.querySelectorAll('.sidebar').forEach(s => s.classList.remove('open'));
            document.getElementById('overlay').classList.remove('show');
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
