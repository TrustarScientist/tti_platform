<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Document</title>
    <style>
        .card{
            position: absolute;
            top: 50%;
        }
    </style>

</head>
<body>
    <div class="card bg-success text-white p-3 rounded w-25">
        please
    </div>
    <button class="btn btn-primary" onclick="window.location.href='/'">Go back</button>
    <script>
        // a program that moves a box across the screen, one step at a time when the button is clicked
        const box = document.querySelector('.card');
        const button = document.querySelector('button');
        
        button.onclick = function() {
            box.style.left = '200px';
        }
    </script>
</body>
</html>
