
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catch the Square Game</title>

    <style>
        /* 1. General page styling */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #1e293b;
            text-align: center;
            margin: 0;
            padding: 24px 16px;
        }

        h1 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        p {
            color: #475569;
        }

        /* 2. Scoreboard */
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 24px 0;
        }

        .score-card {
            background: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #00000010;
            min-width: 120px;
        }

        .score-card span {
            display: block;
            font-size: 14px;
            color: #64748b;
        }

        .score-card strong {
            display: block;
            font-size: 28px;
            margin-top: 6px;
        }

        /* 3. Game area */
        #game-area {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 350px;
            margin: 0 auto 20px;
            background: white;
            border: 3px dashed #94a3b8;
            border-radius: 12px;
            overflow: hidden;
        }

        /* 4. The clickable square */
        #target {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #ef4444;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #target:hover {
            background: #dc2626;
        }

        #target:focus-visible,
        #start-button:focus-visible {
            outline: 3px solid #0f172a;
            outline-offset: 3px;
        }

        /* 5. Start button */
        #start-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #start-button:hover {
            background: #1d4ed8;
        }

        #message {
            min-height: 24px;
            font-weight: bold;
            margin-top: 16px;
        }

        @media (max-width: 480px) {
            #game-area {
                height: 300px;
            }

            .score-card {
                padding: 12px 18px;
            }
        }
    </style>
</head>

<body>

    <h1>🎯 Catch the Square!</h1>
    <p>Click the red square as many times as you can in 30 seconds.</p>

    <!-- Scoreboard -->
    <div class="scoreboard">
        <div class="score-card">
            <span>Score</span>
            <strong id="score">0</strong>
        </div>

        <div class="score-card">
            <span>Time Left</span>
            <strong id="timer">30</strong>
        </div>
    </div>

    <!-- Game area -->
    <div id="game-area">
        <button
            id="target"
            type="button"
            aria-label="Catch the square"
            hidden
        ></button>
    </div>

    <!-- Game controls -->
    <button id="start-button" type="button">
        Start Game
    </button>

    <p id="message" role="status" aria-live="polite">
        Press Start Game to begin!
    </p>

    <script>
        // 1. Get HTML elements
        const gameArea = document.getElementById("game-area");
        const target = document.getElementById("target");
        const scoreDisplay = document.getElementById("score");
        const timerDisplay = document.getElementById("timer");
        const startButton = document.getElementById("start-button");
        const message = document.getElementById("message");

        // 2. Game variables
        let score = 0;
        let timeLeft = 30;
        let timerId = null;
        let isPlaying = false;

        // 3. Move the square to a random position
        function moveSquare() {
            const maxX = gameArea.clientWidth - target.offsetWidth;
            const maxY = gameArea.clientHeight - target.offsetHeight;

            const randomX = Math.floor(Math.random() * (maxX + 1));
            const randomY = Math.floor(Math.random() * (maxY + 1));

            target.style.left = randomX + "px";
            target.style.top = randomY + "px";
        }

        // 4. Start a new game
        function startGame() {
            // Prevent multiple countdown timers
            clearInterval(timerId);

            score = 0;
            timeLeft = 30;
            isPlaying = true;

            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            message.textContent = "Go! Catch the square!";
            startButton.textContent = "Restart Game";

            target.hidden = false;
            moveSquare();

            // Count down once every second
            timerId = setInterval(function () {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // 5. Increase score when the square is clicked
        target.addEventListener("click", function () {
            if (!isPlaying) {
                return;
            }

            score++;
            scoreDisplay.textContent = score;

            // Change the square's color
            const colors = [
                "#ef4444",
                "#22c55e",
                "#3b82f6",
                "#a855f7",
                "#f97316"
            ];

            const randomColor =
                colors[Math.floor(Math.random() * colors.length)];

            target.style.backgroundColor = randomColor;

            // Move the square after a successful click
            moveSquare();
        });

        // 6. End the game
        function endGame() {
            isPlaying = false;
            clearInterval(timerId);
            timerId = null;

            target.hidden = true;
            message.textContent =
                "Time's up! Your final score is " + score + ".";

            startButton.textContent = "Play Again";
        }

        // 7. Connect the start button to the game
        startButton.addEventListener("click", startGame);

        // 8. Keep the square within the game area after resizing
        window.addEventListener("resize", function () {
            if (isPlaying) {
                moveSquare();
            }
        });
    </script>

</body>
</html>
