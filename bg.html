<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            background-color: orangered;
            padding: 1%;
            height: 10vh;
        }
       
    </style>
</head>
<body>
    <section class="parent"> </section>
    <button>Next Friend</button>
    <script>
        // arrays as a topic
        let blessingFriends = ["John", "Peter", "James", "Paul"];
        let nextFriendButton = document.querySelector("button");
        let parentSection = document.querySelector(".parent");

        nextFriendButton.onclick = function(){
            parentSection.textContent = blessingFriends[0];
        }

        
    </script>
</body>
</html>
