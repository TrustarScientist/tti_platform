<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            background-color: orangered;
            padding: 1%;
            height: 10vh;
        }
    </style>
</head>
<body>
    <section class="parent"> </section>
    <button>Next Friend</button>
    <script>
        // your html file is a document, so you can use document.querySelector to select elements from it
        let button = document.querySelector('button');
        let parentSection = document.querySelector('.parent');
        let names = [
            "dan",
            "olivia",
            "mike",
        ]
        let x = 0;


        button.onclick = function(){
            parentSection.textContent = names[x];
            x = x + 1;
        }
    </script>
</body>
</html>
