<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            background-color: orangered;
            padding: 1%;
            height: 10vh;
        }
       
    </style>
</head>
<body>
    <section class="parent"> </section>
    <button>Next Friend</button>
    <script>
        // your html file is a document, so you can use document.querySelector to select elements from it
        const button = document.querySelector('button');
        const parentSection = document.querySelector('.parent');

        button.onclick = function(){
            parentSection.textContent = "Next Friend";
        }
    </script>
</body>
</html>
